{% extends 'base.html' %}{% block content %}<h1>My vehicles</h1><div class="row"><div class="col-md-5"><form method="post" class="card card-body"><label>Registration number</label><input class="form-control mb-3" name="registration_number" placeholder="KDA 123A" required><label>Vehicle type</label><select class="form-select mb-3" name="vehicle_type"><option>CAR</option><option>MOTORCYCLE</option><option>TRUCK</option></select><button class="btn btn-primary">Add vehicle</button></form></div><div class="col-md-7"><div class="card card-body"><h2 class="h5">Registered vehicles</h2>{% for v in vehicles %}<div class="border-bottom py-2">{{ v.registration_number }} <span class="badge bg-secondary">{{ v.vehicle_type }}</span></div>{% else %}<p class="text-muted">No vehicles added.</p>{% endfor %}</div></div></div>{% endblock %}
