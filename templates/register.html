{% extends 'base.html' %}{% block content %}<div class="auth-card"><h1>Create account</h1><form method="post"><label>Full name</label><input class="form-control mb-3" name="full_name" required><label>Email</label><input class="form-control mb-3" type="email" name="email" required><label>Password</label><input class="form-control mb-3" type="password" name="password" minlength="6" required><button class="btn btn-primary w-100">Register</button></form><p class="mt-3">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
