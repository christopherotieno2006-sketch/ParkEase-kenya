{% extends 'base.html' %}{% block content %}<h1>Start parking session</h1>{% if not vehicles %}<div class="alert alert-warning">Add a vehicle before parking. <a href="{{ url_for('vehicles') }}">Add vehicle</a></div>{% endif %}<form method="post" class="card card-body max-form"><label>Vehicle</label><select class="form-select mb-3" name="vehicle_id" required>{% for v in vehicles %}<option value="{{ v.id }}">{{ v.registration_number }} — {{ v.vehicle_type }}</option>{% endfor %}</select><label>Available parking slot</label><select class="form-select mb-3" name="space_id" required>{% for s in spaces %}<option value="{{ s.id }}">{{ s.slot_number }} — Floor {{ s.floor }}</option>{% endfor %}</select><button class="btn btn-primary" {% if not vehicles or not spaces %}disabled{% endif %}>Confirm parking</button></form>{% endblock %}
